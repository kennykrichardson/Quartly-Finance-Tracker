<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Google Search Console verification -->
    <meta
      name="google-site-verification"
      content="wdpJILycECpySr05_4fzGhK5r75ombkyNRIyUVb9jv8"
    />

    <!-- Primary SEO -->
    <title>Quartly • Personal Finance Tracker</title>
    <meta
      name="description"
      content="Quartly is a personal finance tracker designed to help you understand your spending, organize your finances, and make more informed money decisions. Created by Kenny Richardson."
    />
    <meta
      name="keywords"
      content="Quartly, personal finance tracker, finance management, expense tracking, budget tracking, money management, Kenny Richardson, kennykrichardson, Kenny Richardson Kodipally"
    />
    <meta name="author" content="Kenny Richardson" />
    <meta name="creator" content="Kenny Richardson" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://quartly.onrender.com/" />

    <!-- Site icons: place these files in the Vite public/ directory -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quartly" />
    <meta property="og:title" content="Quartly • Personal Finance Tracker" />
    <meta
      property="og:description"
      content="Understand your spending, organize your finances, and make more informed money decisions with Quartly."
    />
    <meta property="og:url" content="https://quartly.onrender.com/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quartly • Personal Finance Tracker" />
    <meta
      name="twitter:description"
      content="A clearer way to understand your spending and manage your personal finances."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured data: Quartly and its creator -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Quartly",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://quartly.onrender.com/",
        "description": "A personal finance tracker designed to help users understand their spending and organize their finances.",
        "creator": {
          "@type": "Person",
          "name": "Kenny Richardson",
          "alternateName": [
            "kennykrichardson",
            "Kenny Richardson Kodipally"
          ],
          "sameAs": [
            "https://github.com/kennykrichardson",
            "https://linkedin.com/in/kennykrichardson"
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

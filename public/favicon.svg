<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none">
  <title>Quartly Glass Q</title>
  <desc>Transparent vector emblem inspired by layered icy-blue, turquoise and deep-navy glass.</desc>
  <defs>
    <linearGradient id="glassOuter" x1="265" y1="260" x2="980" y2="1010" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9FCFF"/>
      <stop offset=".13" stop-color="#59DDF5"/>
      <stop offset=".27" stop-color="#075AAE"/>
      <stop offset=".42" stop-color="#061C4D"/>
      <stop offset=".56" stop-color="#16C8DF"/>
      <stop offset=".72" stop-color="#0B4C93"/>
      <stop offset=".86" stop-color="#BDF8FF"/>
      <stop offset="1" stop-color="#0876B8"/>
    </linearGradient>
    <linearGradient id="glassInner" x1="360" y1="320" x2="850" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#A5F2FF" stop-opacity=".78"/>
      <stop offset=".36" stop-color="#0D8FC8" stop-opacity=".96"/>
      <stop offset=".52" stop-color="#06204D"/>
      <stop offset=".68" stop-color="#4DE9F1" stop-opacity=".9"/>
      <stop offset=".84" stop-color="#0B3676"/>
      <stop offset="1" stop-color="#E6FCFF"/>
    </linearGradient>
    <linearGradient id="tail" x1="625" y1="640" x2="1000" y2="1020" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FFFF"/>
      <stop offset=".2" stop-color="#53E8F5"/>
      <stop offset=".44" stop-color="#0A6DB5"/>
      <stop offset=".64" stop-color="#041D4A"/>
      <stop offset=".83" stop-color="#1AD1E6"/>
      <stop offset="1" stop-color="#E7FFFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="300" y1="250" x2="840" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/>
      <stop offset=".45" stop-color="#C9F8FF" stop-opacity=".58"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="navyEdge" x1="330" y1="330" x2="900" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B315F"/>
      <stop offset=".45" stop-color="#56E7F7"/>
      <stop offset=".7" stop-color="#061C46"/>
      <stop offset="1" stop-color="#16B9DA"/>
    </linearGradient>
    <filter id="glow" x="120" y="120" width="1010" height="1010" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.78  0 0 0 0 0.98  0 0 0 .35 0" result="tint"/>
      <feMerge><feMergeNode in="tint"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ringClip">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M626 212C405 212 226 391 226 612C226 833 405 1012 626 1012C710 1012 788 986 851 941L789 866C742 895 686 912 626 912C460 912 326 778 326 612C326 446 460 312 626 312C792 312 926 446 926 612C926 677 905 737 870 786L943 854C995 786 1026 703 1026 612C1026 391 847 212 626 212Z"/>
    </clipPath>
  </defs>

  <!-- Delicate technical accents, all transparent-background vector strokes -->
  <g stroke="#1387C3" stroke-linecap="round" opacity=".78">
    <path d="M96 300L334 538" stroke-width="2"/>
    <path d="M141 258L390 507" stroke-width="1.5" opacity=".65"/>
    <path d="M915 164L1086 335" stroke-width="2"/>
    <path d="M1038 432L1144 538" stroke-width="1.5"/>
    <path d="M132 783L278 929" stroke-width="2"/>
    <path d="M902 1008L1088 1194" stroke-width="2"/>
    <path d="M244 106L520 382" stroke-width="1" opacity=".55"/>
    <path d="M760 890L1112 1242" stroke-width="1" opacity=".55"/>
  </g>
  <g fill="#07528F">
    <circle cx="368" cy="151" r="5"/><circle cx="381" cy="165" r="3.5"/>
    <circle cx="801" cy="146" r="5" fill="#1BBED5"/><circle cx="815" cy="160" r="3.5"/>
    <circle cx="177" cy="718" r="3.5"/><circle cx="282" cy="907" r="3.5"/>
    <circle cx="1099" cy="624" r="4"/><circle cx="1152" cy="571" r="4"/>
    <circle cx="794" cy="1097" r="4"/><circle cx="650" cy="1162" r="3"/>
  </g>
  <g fill="#063E78" opacity=".95">
    <path d="M270 329l12 12-12 12-12-12z"/>
    <path d="M1048 518l11 11-11 11-11-11z"/>
    <path d="M177 823l5 5-5 5-5-5z"/>
  </g>

  <!-- Outer luminous rim -->
  <path d="M626 195C396 195 209 382 209 612S396 1029 626 1029C713 1029 794 1002 861 955" stroke="#7DEFFF" stroke-width="5" opacity=".72" filter="url(#glow)"/>

  <!-- Main faceted Q ring -->
  <path d="M626 212C405 212 226 391 226 612C226 833 405 1012 626 1012C710 1012 788 986 851 941L789 866C742 895 686 912 626 912C460 912 326 778 326 612C326 446 460 312 626 312C792 312 926 446 926 612C926 677 905 737 870 786L943 854C995 786 1026 703 1026 612C1026 391 847 212 626 212Z"
        fill="url(#glassOuter)" stroke="url(#navyEdge)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Layered translucent facets across the ring -->
  <g clip-path="url(#ringClip)">
    <path d="M175 405L389 191L567 369L359 580Z" fill="#D9FCFF" fill-opacity=".72"/>
    <path d="M389 191L586 157L727 301L567 369Z" fill="#6CE8F7" fill-opacity=".52"/>
    <path d="M567 369L727 301L872 446L716 500Z" fill="#0A8EC6" fill-opacity=".64"/>
    <path d="M716 500L872 446L1025 608L872 664Z" fill="#06234F" fill-opacity=".82"/>
    <path d="M872 664L1025 608L1038 809L904 844Z" fill="#18CDE0" fill-opacity=".7"/>
    <path d="M904 844L1038 809L903 1020L789 930Z" fill="#072B61" fill-opacity=".88"/>
    <path d="M789 930L903 1020L687 1062L626 912Z" fill="#64ECF4" fill-opacity=".62"/>
    <path d="M626 912L687 1062L483 1018L445 864Z" fill="#075AA2" fill-opacity=".7"/>
    <path d="M445 864L483 1018L286 889L326 732Z" fill="#D4FAFF" fill-opacity=".58"/>
    <path d="M326 732L286 889L169 691L326 612Z" fill="#0A6AB0" fill-opacity=".72"/>
    <path d="M326 612L169 691L209 479L359 580Z" fill="#5EE6F3" fill-opacity=".65"/>
    <path d="M359 580L209 479L389 191L567 369Z" fill="#052D65" fill-opacity=".42"/>
    <path d="M290 420L445 300L567 369L359 580Z" fill="#FFFFFF" fill-opacity=".18"/>
    <path d="M716 500L804 349L926 469L872 664Z" fill="#C8F8FF" fill-opacity=".22"/>
    <path d="M445 864L626 912L483 1018L326 917Z" fill="#061C4B" fill-opacity=".34"/>
  </g>

  <!-- Inner bevel and reflective edge -->
  <path d="M626 312C792 312 926 446 926 612C926 677 905 737 870 786"
        stroke="#D9FFFF" stroke-width="8" stroke-linecap="round" opacity=".92"/>
  <path d="M626 912C460 912 326 778 326 612C326 446 460 312 626 312"
        stroke="#05285C" stroke-width="7" opacity=".88"/>
  <path d="M626 321C787 321 917 451 917 612" stroke="#4DE8FA" stroke-width="3" opacity=".9"/>

  <!-- The Q tail: a separate, beveled glass ribbon -->
  <path d="M606 666L681 616L1045 980L879 980L603 704Z"
        fill="url(#tail)" stroke="#D5FCFF" stroke-width="7" stroke-linejoin="round"/>
  <path d="M606 666L681 616L1045 980L981 980L647 652Z"
        fill="url(#shine)" opacity=".78"/>
  <path d="M681 616L1045 980L879 980L603 704"
        stroke="#0A2C61" stroke-width="5" stroke-linejoin="round" opacity=".9"/>
  <path d="M629 681L887 941" stroke="#7CF5FF" stroke-width="6" stroke-linecap="round" opacity=".94"/>
  <path d="M683 638L1015 971" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".95"/>
  <path d="M752 725L858 831L816 873L711 768Z" fill="#6CECF5" fill-opacity=".34"/>

  <!-- Glass glints -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <path d="M339 352L443 456" stroke-width="5"/>
    <path d="M329 342L350 363" stroke-width="2" opacity=".85"/>
    <path d="M851 548L876 573" stroke-width="4"/>
    <path d="M279 744L317 782" stroke-width="3" opacity=".8"/>
    <path d="M758 915L787 944" stroke-width="4"/>
  </g>
  <g fill="#18CBE0">
    <circle cx="481" cy="464" r="3.5"/><circle cx="996" cy="392" r="3"/>
    <circle cx="1018" cy="453" r="2.5"/><circle cx="821" cy="1007" r="3"/>
  </g>
</svg>